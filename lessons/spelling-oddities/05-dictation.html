<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelling oddities: Dictation</title>
<style>html,body{margin:0;padding:12px 0;background:#f7f8fa;}</style>
</head>
<body>
<div id="so5">
  <style>
    #so5{--ink:#1d2733;--muted:#5b6b7c;--paper:#f7f8fa;--card:#fff;--line:#d9e0ea;
      --teal:#155E75;--teal-bg:#E0F2F7;--terra:#D97757;--terra-bg:#FBEEE8;--slate:#64748B;--slate-bg:#F1F5F9;
      --ok:#1f8a4c;--ok-bg:#e6f5ec;--no:#b23a3a;--no-bg:#fbeaea;--amber:#F4B942;--amber-bg:#fff7e6;
      font-family:Verdana,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.55;color:var(--ink);
      background:var(--paper);max-width:820px;margin:0 auto;padding:20px 22px 26px;border-radius:14px;}
    #so5 *{box-sizing:border-box;}
    #so5 h1{font-size:28px;margin:0 0 4px;color:var(--teal);line-height:1.25;}
    #so5 h2{font-size:21px;margin:22px 0 8px;color:var(--teal);}
    #so5 .sub{margin:0 0 18px;color:var(--muted);font-size:16px;}
    #so5 .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
    #so5 .q{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--amber);border-radius:12px;padding:14px 18px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start;}
    #so5 .q b{color:var(--teal);font-size:22px;min-width:28px;}
    #so5 .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center;}
    #so5 button{font-family:inherit;font-size:16px;font-weight:bold;border:2px solid var(--teal);border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--teal);color:#fff;}
    #so5 button:hover{background:#0f4a5c;}
    #so5 button.ghost{background:transparent;color:var(--teal);}
    #so5 button.amber{background:var(--amber);border-color:var(--amber);color:var(--ink);}
    #so5 button:disabled{opacity:.45;cursor:default;}
    #so5 .choice{border-color:var(--line);background:#fff;color:var(--ink);font-weight:normal;}
    #so5 .choice:hover{background:var(--teal-bg);border-color:var(--teal);}
    #so5 .choice.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:bold;opacity:1;}
    #so5 .choice.no{background:var(--no-bg);border-color:var(--no);color:var(--no);opacity:1;}
    #so5 .fb{font-weight:bold;margin-top:8px;font-size:16px;}
    #so5 .fb.ok{color:var(--ok);} #so5 .fb.no{color:var(--no);}
    #so5 .plain{font-weight:normal;color:var(--ink);}
    #so5 input[type=text],#so5 textarea{font:inherit;font-size:17px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink);}
    #so5 textarea{min-height:84px;resize:vertical;}
    #so5 input[type=text]:focus,#so5 textarea:focus{outline:none;border-color:var(--teal);}
    #so5 select{font:inherit;font-size:16px;padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:100%;}
    #so5 select.ok{border-color:var(--ok);background:var(--ok-bg);} #so5 select.no{border-color:var(--no);background:var(--no-bg);}
    #so5 .score{text-align:center;color:var(--muted);font-size:16px;margin-top:10px;font-weight:bold;}
    #so5 .talk{margin-top:22px;padding:16px 20px;border-radius:12px;background:var(--amber-bg);border:2px solid #f1d9a6;}
    #so5 .talk p{margin:0 0 6px;}
    #so5 .note{font-size:14px;color:var(--muted);}
    #so5 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
    #so5 .card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px;text-align:center;font-weight:bold;font-size:19px;color:var(--teal);cursor:pointer;}
    #so5 .card:hover{border-color:var(--teal);}
    #so5 .card.on{border-color:var(--terra);background:var(--terra-bg);color:var(--terra);}
    #so5 .item{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start;}
    #so5 .item:first-child{border-top:none;}
    #so5 .item > b{color:var(--teal);}
    #so5 .video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin:12px 0;}
    #so5 .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
    #so5 .letters{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
    #so5 .letters button{min-width:38px;padding:8px 0;font-size:20px;font-family:"Courier New",monospace;background:#fff;color:var(--ink);border-color:var(--line);}
    #so5 .letters button:hover{background:var(--teal-bg);border-color:var(--teal);}
    #so5 .letters button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);opacity:1;}
    #so5 .letters button.no{background:var(--no-bg);border-color:var(--no);color:var(--no);text-decoration:line-through;opacity:1;}
    #so5 .words span.w{cursor:pointer;padding:2px 3px;border-radius:5px;border:2px solid transparent;}
    #so5 .words span.w:hover{border-color:var(--teal);background:var(--teal-bg);}
    #so5 .words.done span.w{cursor:default;} #so5 .words.done span.w:hover{border-color:transparent;background:none;}
    #so5 span.w.no{background:var(--no-bg)!important;border-color:var(--no)!important;color:var(--no);text-decoration:line-through;}
    #so5 span.w.ok{background:var(--ok-bg)!important;border-color:var(--ok)!important;color:var(--ok);font-weight:bold;}
    #so5 .diff{font-size:17px;line-height:2;}
    #so5 .diff .lab{display:inline-block;min-width:80px;font-size:13px;font-weight:bold;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
    #so5 .diff del{background:var(--no-bg);color:var(--no);border-radius:4px;padding:1px 3px;}
    #so5 .diff ins{background:var(--ok-bg);color:var(--ok);text-decoration:none;font-weight:bold;border-radius:4px;padding:1px 3px;}
    #so5 .resp{font-family:"Courier New",monospace;font-size:19px;font-weight:bold;color:var(--terra);}
    #so5 .play{padding:6px 12px;font-size:15px;}
    #so5 .hide{display:none;}
  </style>

  <h1>Dictation</h1>
  <p class="sub">Your teacher reads three sentences, twice each. Type what you hear. Some of the words are famous for being hard to spell. Do your best, then check.</p>
  <div class="panel" id="so5-p"><div class="item"><b>A</b><div><textarea data-i="0" autocomplete="off" spellcheck="false"></textarea><div class="res"></div></div></div><div class="item"><b>B</b><div><textarea data-i="1" autocomplete="off" spellcheck="false"></textarea><div class="res"></div></div></div><div class="item"><b>C</b><div><textarea data-i="2" autocomplete="off" spellcheck="false"></textarea><div class="res"></div></div></div>
    <div class="btns"><button id="so5-check">Check my sentences</button></div>
    <p class="note">Spell-check is off on purpose. Capitals and punctuation do not count.</p>
  </div>
  <div class="score" id="so5-score"></div>


  <script>
  (function(){
    var box=document.getElementById('so5-p'); if(!box) return;
    var D=["The colonel and his clever lieutenant planned a secret coup, with a clever mnemonic to remember every rule.", "At her grand debut, she danced gracefully through every genre, but then dropped the bouquet of flowers: a tiny faux pas the audience talked about for hours.", "Filled with ennui, I watched a buoy by the bay, spilling Worcestershire sauce in my tray and sighing, 'What a day!'"], T=["colonel", "lieutenant", "coup", "mnemonic", "debut", "genre", "bouquet", "faux", "pas", "ennui", "buoy", "worcestershire"], locked=false;
    function toks(s){ return (s.toLowerCase().replace(/[’‘]/g,"'").match(/[a-z']+/g)||[]).map(function(t){return t.replace(/^'+|'+$/g,'');}).filter(Boolean); }
    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function lcs(a,b){
      var m=a.length,n=b.length,L=[],i,j; for(i=0;i<=m;i++){ L.push(new Array(n+1).fill(0)); }
      for(i=m-1;i>=0;i--) for(j=n-1;j>=0;j--) L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
      var ka={},kb={}; i=0;j=0; while(i<m&&j<n){ if(a[i]===b[j]){ka[i]=1;kb[j]=1;i++;j++;} else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
      return [ka,kb];
    }
    document.getElementById('so5-check').addEventListener('click',function(){
      if(locked) return; locked=true; this.disabled=true; this.textContent='Checked';
      var tas=box.querySelectorAll('textarea'), totalT=0, gotT=0;
      for(var i=0;i<tas.length;i++){
        tas[i].readOnly=true;
        var you=toks(tas[i].value), ref=toks(D[i]), m=lcs(you,ref), a=m[0], b=m[1], y='', r='';
        for(var k=0;k<you.length;k++) y+=(a[k]?esc(you[k]):'<del>'+esc(you[k])+'</del>')+' ';
        for(var k=0;k<ref.length;k++){
          var tgt=T.indexOf(ref[k])>=0; if(tgt){ totalT++; if(b[k]) gotT++; }
          r+=(b[k]?(tgt?'<strong>'+esc(ref[k])+'</strong>':esc(ref[k])):'<ins>'+esc(ref[k])+'</ins>')+' ';
        }
        tas[i].parentNode.querySelector('.res').innerHTML='<div class="diff" style="margin-top:8px"><div><span class="lab">You</span> '+(you.length?y:'<span class="note">(nothing typed)</span>')+'</div><div><span class="lab">Correct</span> '+r+'</div></div>';
      }
      document.getElementById('so5-score').textContent='The hard words: '+gotT+' of '+totalT+' spelled right. Red is what you wrote; green is what was missing or different.';
    });
  })();
  </script>
</div>
</body>
</html>
