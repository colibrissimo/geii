<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelling oddities: What is the joke about?</title>
<style>html,body{margin:0;padding:12px 0;background:#f7f8fa;}</style>
</head>
<body>
<div id="so2">
  <style>
    #so2{--ink:#1d2733;--muted:#5b6b7c;--paper:#f7f8fa;--card:#fff;--line:#d9e0ea;
      --teal:#155E75;--teal-bg:#E0F2F7;--terra:#D97757;--terra-bg:#FBEEE8;--slate:#64748B;--slate-bg:#F1F5F9;
      --ok:#1f8a4c;--ok-bg:#e6f5ec;--no:#b23a3a;--no-bg:#fbeaea;--amber:#F4B942;--amber-bg:#fff7e6;
      font-family:Verdana,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.55;color:var(--ink);
      background:var(--paper);max-width:820px;margin:0 auto;padding:20px 22px 26px;border-radius:14px;}
    #so2 *{box-sizing:border-box;}
    #so2 h1{font-size:28px;margin:0 0 4px;color:var(--teal);line-height:1.25;}
    #so2 h2{font-size:21px;margin:22px 0 8px;color:var(--teal);}
    #so2 .sub{margin:0 0 18px;color:var(--muted);font-size:16px;}
    #so2 .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
    #so2 .q{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--amber);border-radius:12px;padding:14px 18px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start;}
    #so2 .q b{color:var(--teal);font-size:22px;min-width:28px;}
    #so2 .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center;}
    #so2 button{font-family:inherit;font-size:16px;font-weight:bold;border:2px solid var(--teal);border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--teal);color:#fff;}
    #so2 button:hover{background:#0f4a5c;}
    #so2 button.ghost{background:transparent;color:var(--teal);}
    #so2 button.amber{background:var(--amber);border-color:var(--amber);color:var(--ink);}
    #so2 button:disabled{opacity:.45;cursor:default;}
    #so2 .choice{border-color:var(--line);background:#fff;color:var(--ink);font-weight:normal;}
    #so2 .choice:hover{background:var(--teal-bg);border-color:var(--teal);}
    #so2 .choice.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:bold;opacity:1;}
    #so2 .choice.no{background:var(--no-bg);border-color:var(--no);color:var(--no);opacity:1;}
    #so2 .fb{font-weight:bold;margin-top:8px;font-size:16px;}
    #so2 .fb.ok{color:var(--ok);} #so2 .fb.no{color:var(--no);}
    #so2 .plain{font-weight:normal;color:var(--ink);}
    #so2 input[type=text],#so2 textarea{font:inherit;font-size:17px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink);}
    #so2 textarea{min-height:84px;resize:vertical;}
    #so2 input[type=text]:focus,#so2 textarea:focus{outline:none;border-color:var(--teal);}
    #so2 select{font:inherit;font-size:16px;padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:100%;}
    #so2 select.ok{border-color:var(--ok);background:var(--ok-bg);} #so2 select.no{border-color:var(--no);background:var(--no-bg);}
    #so2 .score{text-align:center;color:var(--muted);font-size:16px;margin-top:10px;font-weight:bold;}
    #so2 .talk{margin-top:22px;padding:16px 20px;border-radius:12px;background:var(--amber-bg);border:2px solid #f1d9a6;}
    #so2 .talk p{margin:0 0 6px;}
    #so2 .note{font-size:14px;color:var(--muted);}
    #so2 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
    #so2 .card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px;text-align:center;font-weight:bold;font-size:19px;color:var(--teal);cursor:pointer;}
    #so2 .card:hover{border-color:var(--teal);}
    #so2 .card.on{border-color:var(--terra);background:var(--terra-bg);color:var(--terra);}
    #so2 .item{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start;}
    #so2 .item:first-child{border-top:none;}
    #so2 .item > b{color:var(--teal);}
    #so2 .video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin:12px 0;}
    #so2 .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
    #so2 .letters{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
    #so2 .letters button{min-width:38px;padding:8px 0;font-size:20px;font-family:"Courier New",monospace;background:#fff;color:var(--ink);border-color:var(--line);}
    #so2 .letters button:hover{background:var(--teal-bg);border-color:var(--teal);}
    #so2 .letters button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);opacity:1;}
    #so2 .letters button.no{background:var(--no-bg);border-color:var(--no);color:var(--no);text-decoration:line-through;opacity:1;}
    #so2 .words span.w{cursor:pointer;padding:2px 3px;border-radius:5px;border:2px solid transparent;}
    #so2 .words span.w:hover{border-color:var(--teal);background:var(--teal-bg);}
    #so2 .words.done span.w{cursor:default;} #so2 .words.done span.w:hover{border-color:transparent;background:none;}
    #so2 span.w.no{background:var(--no-bg)!important;border-color:var(--no)!important;color:var(--no);text-decoration:line-through;}
    #so2 span.w.ok{background:var(--ok-bg)!important;border-color:var(--ok)!important;color:var(--ok);font-weight:bold;}
    #so2 .diff{font-size:17px;line-height:2;}
    #so2 .diff .lab{display:inline-block;min-width:80px;font-size:13px;font-weight:bold;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
    #so2 .diff del{background:var(--no-bg);color:var(--no);border-radius:4px;padding:1px 3px;}
    #so2 .diff ins{background:var(--ok-bg);color:var(--ok);text-decoration:none;font-weight:bold;border-radius:4px;padding:1px 3px;}
    #so2 .resp{font-family:"Courier New",monospace;font-size:19px;font-weight:bold;color:var(--terra);}
    #so2 .play{padding:6px 12px;font-size:15px;}
    #so2 .hide{display:none;}
  </style>

  <h1>What is the joke about?</h1>
  <p class="sub">A stand-up comedian jokes about English. Watch to <strong>01:32</strong>. The video stops there.</p>
  <div class="video"><iframe src="https://www.youtube.com/embed/BrJv_wUEKko?rel=0&end=92" title="Stand-up comedy clip" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  <div class="panel">
    <div>The joke is about this: <strong>&hellip;</strong></div>
    <div class="btns" id="so2-o"><button class="choice" data-j="0">English spelling keeps changing</button><button class="choice" data-j="1">Many English words have letters nobody says</button><button class="choice" data-j="2">British people speak too fast</button><button class="choice" data-j="3">English has too many words from French</button></div>
    <div class="fb" id="so2-fb"></div>
  </div>
  <div class="talk hide" id="so2-talk">
    <p><strong>Which examples did he use?</strong> How many can you and your partner remember?</p>
  </div>


  <script>
  (function(){
    var box=document.getElementById('so2-o'); if(!box) return; var K=1;
    box.addEventListener('click',function(e){
      var b=e.target.closest?e.target.closest('button'):null; if(!b||b.disabled) return;
      var j=+b.getAttribute('data-j'), bs=box.querySelectorAll('button');
      for(var k=0;k<bs.length;k++){ bs[k].disabled=true; if(k===K) bs[k].className='choice ok'; }
      if(j!==K) b.className='choice no';
      var fb=document.getElementById('so2-fb'); fb.className='fb '+(j===K?'ok':'no');
      fb.innerHTML=(j===K?'Yes. ':'Not quite. ')+'<span class="plain">He jokes about <strong>silent letters</strong>: letters we write but never say.</span>';
      document.getElementById('so2-talk').classList.remove('hide');
    });
  })();
  </script>
</div>
</body>
</html>
